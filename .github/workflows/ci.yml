name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      local_rerank_smoke:
        description: Run the real Xenova/bge-reranker-base smoke matrix
        required: false
        default: false
        type: boolean
      local_model_smoke:
        description: Run the real isolated local embedding and rerank smoke matrix
        required: false
        default: false
        type: boolean
      mineru_managed_smoke:
        description: Install managed MinerU and run real PDF parse/lifecycle smoke on Windows and Ubuntu
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_COMMIT: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Validate plugin build policy
        run: node scripts/verify-build-policy.mjs
      - name: Check out the pinned DSH compatibility anchor
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/deepseek-ai/deepseek-harness "$GITHUB_WORKSPACE/../dsh"
          git -C "$GITHUB_WORKSPACE/../dsh" checkout "$DSH_COMMIT"
      - name: Build DSH library types
        working-directory: ../dsh
        run: pnpm install --frozen-lockfile && pnpm run build:lib
      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile
      - run: npm run verify:release
      - run: npm run audit:prod:self-test
      - run: npm run audit:prod
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - run: npm run verify:package
      # Prove every emitted companion bundle loads, speaks its protocol and shuts
      # down cleanly. vitest runs src/, where three of the four exist only as .ts,
      # so this is the only gate that executes those child implementations at all.
      - run: npm run smoke:workers

  native-platform:
    name: Native (${{ matrix.os }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Validate plugin build policy
        run: node scripts/verify-build-policy.mjs
      - name: Check out the pinned DSH compatibility anchor
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/deepseek-ai/deepseek-harness "$GITHUB_WORKSPACE/../dsh"
          git -C "$GITHUB_WORKSPACE/../dsh" checkout "$DSH_COMMIT"
      - name: Build DSH library types
        working-directory: ../dsh
        run: pnpm install --frozen-lockfile && pnpm run build:lib
      - run: pnpm install --frozen-lockfile
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fork/worker behaviour is platform-specific (Windows cannot rename a file a
      # native runtime holds open, process spawn differs, …), so run the bundle
      # protocol smoke on every native platform too.
      - run: npm run smoke:workers

  packed-dsh-smoke:
    name: Packed DSH smoke (${{ matrix.os }}, DSH ${{ matrix.dsh }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dsh: [0.1.1-rc.2, 0.2.0-rc.2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Validate plugin build policy
        run: node scripts/verify-build-policy.mjs
      - name: Check out the pinned DSH compatibility anchor
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/deepseek-ai/deepseek-harness "$GITHUB_WORKSPACE/../dsh"
          git -C "$GITHUB_WORKSPACE/../dsh" checkout "$DSH_COMMIT"
      - name: Build DSH library types
        working-directory: ../dsh
        run: pnpm install --frozen-lockfile && pnpm run build:lib
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - name: Install pinned public DSH CLI
        shell: bash
        env:
          DSH_CLI_VERSION: ${{ matrix.dsh }}
        run: |
          node --input-type=module -e '
            import { mkdirSync, writeFileSync } from "node:fs";
            import { join } from "node:path";
            const root = join(process.env.RUNNER_TEMP, "dsh-smoke-cli");
            mkdirSync(root, { recursive: true });
            const version = process.env.DSH_CLI_VERSION;
            const manifest = {
              private: true,
              dependencies: { "@deepseek-ai/dsh": version },
              // Later HMR releases removed registerConfig, which this CLI uses.
              ...(version === "0.1.1-rc.2" ? { overrides: { "@deepseek-ai/cordis-plugin-hmr": "1.0.16" } } : {}),
            };
            writeFileSync(join(root, "package.json"), JSON.stringify(manifest));
            writeFileSync(process.env.GITHUB_ENV, `DSH_CMD=${join(root, "node_modules", "@deepseek-ai", "dsh", "lib", "bin.js")}\n`, { flag: "a" });
          '
          npm install --prefix "$RUNNER_TEMP/dsh-smoke-cli" --omit=dev --no-audit --no-fund
      - name: Install tarball and boot DSH
        run: npm run smoke:packed

  local-model-smoke:
    name: Local model smoke (Ubuntu, Node ${{ matrix.node }})
    if: github.event_name == 'workflow_dispatch' && (inputs.local_rerank_smoke || inputs.local_model_smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Cache local rerank model
        uses: actions/cache@v4
        with:
          path: ~/.dsh/cache/dsh-knowledge/local-models/Xenova/bge-reranker-base
          key: local-rerank-${{ runner.os }}-${{ matrix.node }}-bge-base-v1
      - name: Check out the pinned DSH compatibility anchor
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/deepseek-ai/deepseek-harness "$GITHUB_WORKSPACE/../dsh"
          git -C "$GITHUB_WORKSPACE/../dsh" checkout "$DSH_COMMIT"
      - name: Build DSH library types
        working-directory: ../dsh
        run: pnpm install --frozen-lockfile && pnpm run build:lib
      - run: pnpm install --frozen-lockfile
      - run: npm run smoke:local-embedding
      - run: npm run smoke:local-rerank

  managed-mineru-smoke:
    name: Managed MinerU smoke (${{ matrix.os }}, Python ${{ matrix.python }})
    if: github.event_name == 'workflow_dispatch' && inputs.mineru_managed_smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Check out the pinned DSH compatibility anchor
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/deepseek-ai/deepseek-harness "$GITHUB_WORKSPACE/../dsh"
          git -C "$GITHUB_WORKSPACE/../dsh" checkout "$DSH_COMMIT"
      - name: Build DSH library types
        working-directory: ../dsh
        run: pnpm install --frozen-lockfile && pnpm run build:lib
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - name: Pack release candidate and record its digest
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync, appendFileSync } from "node:fs"; import { join, sep } from "node:path"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); const path = join(process.env.RUNNER_TEMP, `${pkg.name}-${pkg.version}.tgz`); const digest = createHash("sha256").update(readFileSync(path)).digest("hex"); const portablePath = path.split(sep).join("/"); appendFileSync(process.env.GITHUB_ENV, `DSH_KNOWLEDGE_TARBALL_SHA256=${digest}\nDSH_KNOWLEDGE_TARBALL_PATH=${portablePath}\n`);'
      - name: Extract the exact packed artifact for the smoke
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/managed-package"
          tar -xzf "$DSH_KNOWLEDGE_TARBALL_PATH" -C "$RUNNER_TEMP/managed-package"
      - name: Run real managed MinerU install and parse smoke
        env:
          MINERU_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          MINERU_PACKAGE_ROOT: ${{ runner.temp }}/managed-package/package
          MINERU_SMOKE_REPORT_PATH: ${{ runner.temp }}/managed-mineru-smoke-report.json
        run: npm run smoke:mineru-managed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-mineru-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ runner.temp }}/managed-mineru-smoke-report.json
          if-no-files-found: ignore
          retention-days: 30
