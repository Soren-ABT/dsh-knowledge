name: Feature request
description: Propose a focused improvement to dsh-knowledge
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem rather than only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Intended users and workflow
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
      description: Note effects on DSH versions, stored knowledge, models, operating systems, or existing tools.
